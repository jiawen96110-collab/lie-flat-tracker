<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f2ef">
  <title>Z先生躺平组合</title>
  <link rel="stylesheet" href="style.css?v=33">
</head>
<body>
  <main class="main-container single-page">
    <nav class="topbar" aria-label="顶部导航">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <i></i><i></i><i></i>
          <svg viewBox="0 0 32 22" focusable="false">
            <path class="brand-line" d="M5 15.5 L12 11.5 L18 13.2 L27 6.4"></path>
            <path class="brand-arrow" d="M23.4 5.9 L27 6.4 L26.1 9.7"></path>
          </svg>
        </span>
        <span class="brand-en">Balance</span>
        <span class="brand-cn">Z先生躺平组合</span>
      </div>
      <button class="btn-refresh" id="btnRefresh" onclick="refreshAll()">
        <span class="refresh-icon" aria-hidden="true">↻</span>
        刷新数据
      </button>
    </nav>

    <header class="header">
      <p class="eyebrow">Multi-market portfolio</p>
      <h1>Z先生躺平组合</h1>
      <p class="subtitle">三市场 ETF 组合、持仓与净值走势。</p>
    </header>

    <div class="status-bar">
      <div class="status-left">
        <div class="dot loading" id="statusDot"></div>
        <span class="time" id="statusText">正在加载数据...</span>
        <span class="update-badge" id="updateBadge"></span>
      </div>
    </div>

    <section class="portfolios page-panel active" id="panel-portfolio" data-page-panel="portfolio" role="region" aria-label="三市场组合">
      <article class="portfolio us" id="port-us">
        <div class="portfolio-header">
          <div class="left"><span class="name">美股组合</span></div>
        </div>
        <div class="holdings" id="holdings-panel-us" aria-label="美股组合持仓">
          <div class="change-header"><span>权重</span><span>持仓</span><span>当日</span><span>YTD</span></div>
          <div id="holdings-us"></div>
        </div>
        <div class="portfolio-section-heading"><strong>净值走势</strong><span>2026 年以来</span></div>
        <div class="portfolio-chart" id="chart-us" aria-label="美股组合净值走势"></div>
      </article>

      <article class="portfolio hk" id="port-hk">
        <div class="portfolio-header">
          <div class="left"><span class="name">港股组合</span></div>
        </div>
        <div class="holdings" id="holdings-panel-hk" aria-label="港股组合持仓">
          <div class="change-header"><span>权重</span><span>持仓</span><span>当日</span><span>YTD</span></div>
          <div id="holdings-hk"></div>
        </div>
        <div class="portfolio-section-heading"><strong>净值走势</strong><span>2026 年以来</span></div>
        <div class="portfolio-chart" id="chart-hk" aria-label="港股组合净值走势"></div>
      </article>

      <article class="portfolio a" id="port-a">
        <div class="portfolio-header">
          <div class="left"><span class="name">A 股组合</span></div>
        </div>
        <div class="holdings" id="holdings-panel-a" aria-label="A股组合持仓">
          <div class="change-header"><span>权重</span><span>持仓</span><span>当日</span><span>YTD</span></div>
          <div id="holdings-a"></div>
        </div>
        <div class="portfolio-section-heading"><strong>净值走势</strong><span>2026 年以来</span></div>
        <div class="portfolio-chart" id="chart-a" aria-label="A股组合净值走势"></div>
      </article>

    </section>

    <footer class="footer">
      <span class="footer-note">市场有风险，投资需谨慎。</span>
    </footer>
  </main>

  <script src="portfolio_config.js?v=1"></script>
  <script src="data.js?v=4"></script>
  <script src="portfolio_history.js?v=3"></script>
  <script src="app.js?v=20"></script>
</body>
</html>
